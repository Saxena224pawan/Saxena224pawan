    <path d="M80 0v330M160 0v330M240 0v330M320 0v330M400 0v330M480 0v330M560 0v330M640 0v330M720 0v330M800 0v330M880 0v330M960 0v330M1040 0v330M1120 0v330"/>
  </g>
  <g transform="translate(862 44)" fill="none">
