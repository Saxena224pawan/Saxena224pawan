  <text x="72" y="135" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Pawan Saxena</text>
  <text x="74" y="186" fill="#a5f3fc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="1">AI · COMPUTER VISION · ROBOTICS</text>
